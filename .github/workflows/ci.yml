name: Build and test
on:
  push:
    branches: [first, main, backend-node-migration]
  pull_request:
    branches: [first, main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wishful
          POSTGRES_USER: wishful
          POSTGRES_PASSWORD: wishful_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wishful -d wishful"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://wishful:wishful_local_only@localhost:5432/wishful
      JWT_SECRET: ci-only-test-signing-key-at-least-thirty-two-bytes-long
      FRONTEND_URL: http://localhost:3000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
