server:
  port: ${PORT:8080}
  error:
    include-message: always
spring:
  application:
    name: wishful-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wishful}
    username: ${DATABASE_USERNAME:wishful}
    password: ${DATABASE_PASSWORD:wishful_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-change-me-32-bytes-minimum}
    expiration-minutes: 720
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
