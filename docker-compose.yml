services:
  postgres:
    image: postgres:16-alpine
    container_name: wishful-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wishful
      POSTGRES_USER: wishful
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wishful_local_only}
    ports:
      - "5432:5432"
    volumes:
      - wishful_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wishful -d wishful"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  wishful_pgdata:
